<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Admin Login</title>
  <style>
    :root{
      --bg:#0b1220;
      --card:#121b2f;
      --text:#e6eefc;
      --muted:#9db0d0;
      --accent:#4f8cff;
      --danger:#ff4d4f;
      --input:#0f1730;
    }
    *{box-sizing:border-box;}
    body{
      margin:0;
      min-height:100vh;
      display:flex;
      align-items:center;
      justify-content:center;
      background: radial-gradient(1200px 600px at 30% 20%, rgba(79,140,255,0.25), transparent), var(--bg);
      color:var(--text);
      font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Arial, "Noto Sans", "Liberation Sans", sans-serif;
      padding: 18px;
    }
    .wrap{width:100%; max-width:420px;}
    .card{
      background: linear-gradient(180deg, rgba(255,255,255,0.03), rgba(255,255,255,0.01));
      border:1px solid rgba(255,255,255,0.08);
      border-radius:16px;
      padding: 22px;
      box-shadow: 0 18px 60px rgba(0,0,0,0.45);
    }
    h1{margin:0 0 8px; font-size:22px; letter-spacing:0.2px;}
    p{margin:0 0 18px; color:var(--muted); font-size:13px;}
    form{display:flex; flex-direction:column; gap:12px;}
    label{font-size:12px; color:var(--muted);}
    input{
      width:100%;
      padding: 12px 12px;
      border-radius:12px;
      border:1px solid rgba(255,255,255,0.10);
      background: var(--input);
      color: var(--text);
      outline: none;
    }
    input:focus{
      border-color: rgba(79,140,255,0.65);
      box-shadow: 0 0 0 3px rgba(79,140,255,0.18);
    }
    .btn{
      border:0;
      background: var(--accent);
      color:#061024;
      font-weight:700;
      padding: 12px;
      border-radius:12px;
      cursor:pointer;
    }
    .btn:active{transform: translateY(1px);} 
    .error{
      background: rgba(255,77,79,0.12);
      border:1px solid rgba(255,77,79,0.35);
      color: #ffb4b5;
      padding: 10px 12px;
      border-radius: 12px;
      font-size: 13px;
      margin-bottom: 10px;
    }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="card">
      <h1>Admin Dashboard Login</h1>
      <p>Remote Software Control System</p>

      {% if error %}
        <div class="error">{{ error }}</div>
      {% endif %}

      <form method="POST" action="/login">
        <div>
          <label for="username">Username</label>
          <input id="username" name="username" autocomplete="username" required />
        </div>
        <div>
          <label for="password">Password</label>
          <input id="password" name="password" type="password" autocomplete="current-password" required />
        </div>
        <button class="btn" type="submit">Login</button>
      </form>
    </div>
  </div>
</body>
</html>
