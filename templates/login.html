<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Admin Login - Remote Control</title>
  <!-- Outfit Google Font -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
  
  <style>
    :root{
      --bg: #070b13;
      --glass-bg: rgba(18, 26, 47, 0.45);
      --glass-border: rgba(255, 255, 255, 0.08);
      --text: #f0f4f9;
      --muted: #94a3b8;
      --accent: #4f8cff;
      --accent-glow: rgba(79, 140, 255, 0.25);
      --danger: #f43f5e;
      --input-bg: rgba(0, 0, 0, 0.35);
      --radius-lg: 24px;
      --radius-md: 14px;
      --transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    }
    
    *{
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    
    body{
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: radial-gradient(circle at 50% 30%, rgba(79, 140, 255, 0.12) 0%, rgba(7, 11, 19, 1) 80%), var(--bg);
      color: var(--text);
      font-family: 'Outfit', system-ui, -apple-system, sans-serif;
      padding: 20px;
    }
    
    .wrap{
      width: 100%;
      max-width: 400px;
      perspective: 1000px;
    }
    
    .card{
      background: var(--glass-bg);
      border: 1px solid var(--glass-border);
      border-radius: var(--radius-lg);
      padding: 36px 30px;
      box-shadow: 0 24px 64px rgba(0, 0, 0, 0.4);
      -webkit-backdrop-filter: blur(20px);
      backdrop-filter: blur(20px);
      transition: var(--transition);
      position: relative;
    }
    .card:hover {
      border-color: rgba(79, 140, 255, 0.2);
      box-shadow: 0 32px 80px rgba(79, 140, 255, 0.08);
    }
    
    .card-glow {
      position: absolute;
      top: 0;
      left: 50%;
      transform: translateX(-50%);
      width: 60%;
      height: 2px;
      background: linear-gradient(90deg, transparent, var(--accent), transparent);
    }
    
    h1{
      margin-bottom: 8px;
      font-size: 24px;
      font-weight: 800;
      letter-spacing: -0.5px;
      text-align: center;
    }
    
    p{
      margin-bottom: 28px;
      color: var(--muted);
      font-size: 14px;
      font-weight: 500;
      text-align: center;
    }
    
    form{
      display: flex;
      flex-direction: column;
      gap: 20px;
    }
    
    .form-group {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    
    label{
      font-size: 12px;
      color: var(--muted);
      text-transform: uppercase;
      font-weight: 600;
      letter-spacing: 0.5px;
    }
    
    input{
      width: 100%;
      padding: 14px 16px;
      border-radius: var(--radius-md);
      border: 1px solid var(--glass-border);
      background: var(--input-bg);
      color: var(--text);
      outline: none;
      font-family: inherit;
      font-size: 14.5px;
      transition: var(--transition);
    }
    input:focus{
      border-color: var(--accent);
      box-shadow: 0 0 15px var(--accent-glow);
      background: rgba(0, 0, 0, 0.55);
    }
    
    .btn{
      border: 0;
      background: var(--accent);
      color: #070b13;
      font-weight: 700;
      font-size: 15px;
      padding: 14px;
      border-radius: var(--radius-md);
      cursor: pointer;
      font-family: inherit;
      transition: var(--transition);
      margin-top: 10px;
      box-shadow: 0 4px 20px var(--accent-glow);
    }
    .btn:hover{
      transform: translateY(-1px);
      box-shadow: 0 8px 30px rgba(79, 140, 255, 0.4);
      background: #629aff;
    }
    .btn:active{
      transform: translateY(1px);
    } 
    
    .error{
      background: rgba(244, 63, 94, 0.1);
      border: 1px solid rgba(244, 63, 94, 0.3);
      color: #fda4af;
      padding: 12px 16px;
      border-radius: var(--radius-md);
      font-size: 13.5px;
      margin-bottom: 20px;
      font-weight: 500;
      display: flex;
      align-items: center;
      gap: 8px;
    }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="card">
      <div class="card-glow"></div>
      
      <h1>Dashboard Login</h1>
      <p>Remote Control & Control Center</p>

      {% if error %}
        <div class="error">
          <span>⚠️</span>
          <span>{{ error }}</span>
        </div>
      {% endif %}

      <form method="POST" action="/login">
        <div class="form-group">
          <label for="username">Username</label>
          <input id="username" name="username" autocomplete="username" placeholder="Enter admin username" required />
        </div>
        <div class="form-group">
          <label for="password">Password</label>
          <input id="password" name="password" type="password" autocomplete="current-password" placeholder="Enter admin password" required />
        </div>
        <button class="btn" type="submit">Sign In</button>
      </form>
    </div>
  </div>
</body>
</html>
