<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Vishnu Control</title>
  <style>
    :root {
      --bg: #f5f6f2;
      --surface: #ffffff;
      --surface-2: #eef1ed;
      --ink: #18211d;
      --muted: #647067;
      --line: #d8ded6;
      --line-strong: #b9c3b8;
      --green: #167a4a;
      --green-soft: #e5f4ec;
      --red: #ba2f45;
      --red-soft: #f9e8eb;
      --amber: #a6670c;
      --amber-soft: #fff0d2;
      --teal: #126b73;
      --teal-soft: #e2f3f5;
      --shadow: 0 14px 30px rgba(32, 45, 38, 0.08);
      --radius: 8px;
    }

    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      background: var(--bg);
      color: var(--ink);
      font-family: Inter, Segoe UI, system-ui, -apple-system, sans-serif;
      letter-spacing: 0;
    }

    button, input, select, textarea {
      font: inherit;
      letter-spacing: 0;
    }

    button {
      border: 1px solid var(--line);
      border-radius: 7px;
      background: var(--surface);
      color: var(--ink);
      min-height: 36px;
      padding: 8px 12px;
      font-weight: 700;
      cursor: pointer;
    }
    button:hover { border-color: var(--line-strong); background: var(--surface-2); }
    button.primary { background: var(--ink); color: #fff; border-color: var(--ink); }
    button.good { background: var(--green); border-color: var(--green); color: #fff; }
    button.warn { background: var(--amber-soft); border-color: #e1b861; color: var(--amber); }
    button.danger { background: var(--red); border-color: var(--red); color: #fff; }
    button.ghost { background: transparent; }
    button:disabled { opacity: .5; cursor: not-allowed; }

    .page {
      width: min(1440px, calc(100% - 32px));
      margin: 0 auto;
      padding: 20px 0 40px;
    }

    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      margin-bottom: 16px;
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .mark {
      width: 38px;
      height: 38px;
      border-radius: 8px;
      background: var(--ink);
      color: #fff;
      display: grid;
      place-items: center;
      font-weight: 900;
    }
    h1 { margin: 0; font-size: 24px; line-height: 1.1; }
    .sub { color: var(--muted); font-size: 13px; margin-top: 4px; }
    .top-actions { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; justify-content: flex-end; }
    .top-actions a { color: var(--ink); font-weight: 800; text-decoration: none; padding: 8px 10px; border-radius: 7px; }
    .top-actions a:hover { background: var(--surface-2); }

    .metrics {
      display: grid;
      grid-template-columns: repeat(6, minmax(120px, 1fr));
      gap: 10px;
      margin-bottom: 14px;
    }
    .metric {
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      padding: 12px;
      box-shadow: 0 1px 0 rgba(0,0,0,.03);
    }
    .metric .k { color: var(--muted); font-size: 12px; font-weight: 800; text-transform: uppercase; }
    .metric .v { font-size: 24px; font-weight: 900; margin-top: 4px; }

    .toolbar {
      display: grid;
      grid-template-columns: minmax(220px, 1fr) auto auto auto;
      gap: 10px;
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      padding: 10px;
      margin-bottom: 14px;
      box-shadow: var(--shadow);
    }
    .field, .select {
      width: 100%;
      min-height: 38px;
      border: 1px solid var(--line);
      border-radius: 7px;
      background: #fff;
      padding: 8px 10px;
      color: var(--ink);
      outline: none;
    }
    .field:focus, .select:focus, textarea:focus { border-color: var(--teal); box-shadow: 0 0 0 3px var(--teal-soft); }

    .layout {
      display: grid;
      grid-template-columns: minmax(0, 1fr) 360px;
      gap: 14px;
      align-items: start;
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(360px, 1fr));
      gap: 12px;
    }
    .machine {
      background: var(--surface);
      border: 1px solid var(--line);
      border-left: 5px solid var(--line-strong);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      padding: 14px;
      min-width: 0;
    }
    .machine.active { border-left-color: var(--green); }
    .machine.paused { border-left-color: var(--amber); }
    .machine.killed { border-left-color: var(--red); }
    .machine.update_available { border-left-color: var(--teal); }
    .machine.offline { opacity: .72; }

    .machine-head {
      display: flex;
      justify-content: space-between;
      gap: 10px;
      align-items: start;
      margin-bottom: 10px;
    }
    .machine-name { font-size: 18px; font-weight: 900; overflow-wrap: anywhere; }
    .machine-id { color: var(--muted); font-size: 12px; margin-top: 3px; overflow-wrap: anywhere; }
    .badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      border-radius: 999px;
      padding: 5px 9px;
      font-size: 12px;
      font-weight: 900;
      text-transform: uppercase;
      white-space: nowrap;
      border: 1px solid var(--line);
    }
    .badge.active { background: var(--green-soft); color: var(--green); border-color: #b8dec8; }
    .badge.paused { background: var(--amber-soft); color: var(--amber); border-color: #e6bf69; }
    .badge.killed { background: var(--red-soft); color: var(--red); border-color: #efb1bb; }
    .badge.update_available { background: var(--teal-soft); color: var(--teal); border-color: #a5d9de; }
    .badge.offline { background: var(--surface-2); color: var(--muted); }
    .dot { width: 8px; height: 8px; border-radius: 50%; background: currentColor; }

    .kv {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px 12px;
      border-top: 1px solid var(--line);
      border-bottom: 1px solid var(--line);
      padding: 10px 0;
      margin-bottom: 10px;
    }
    .kv div { min-width: 0; }
    .kv .k { color: var(--muted); font-size: 11px; font-weight: 900; text-transform: uppercase; margin-bottom: 2px; }
    .kv .v { font-size: 13px; font-weight: 750; overflow-wrap: anywhere; }

    .card-actions {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 8px;
    }
    .card-actions button { min-width: 0; padding-left: 6px; padding-right: 6px; }

    .note-row {
      margin-top: 10px;
      display: grid;
      gap: 6px;
    }
    .note-row label { color: var(--muted); font-size: 11px; font-weight: 900; text-transform: uppercase; }
    .note-row textarea {
      width: 100%;
      min-height: 58px;
      resize: vertical;
      border: 1px solid var(--line);
      border-radius: 7px;
      padding: 8px 10px;
    }

    .side {
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      padding: 14px;
      position: sticky;
      top: 12px;
    }
    .side h2 { font-size: 16px; margin: 0 0 8px; }
    .event-list { display: grid; gap: 8px; }
    .event {
      border-left: 3px solid var(--line-strong);
      padding-left: 8px;
      color: var(--muted);
      font-size: 13px;
      line-height: 1.35;
    }
    .event strong { color: var(--ink); }

    .empty {
      background: var(--surface);
      border: 1px dashed var(--line-strong);
      border-radius: var(--radius);
      padding: 30px;
      color: var(--muted);
      text-align: center;
      font-weight: 750;
    }

    .modal-backdrop {
      position: fixed;
      inset: 0;
      display: none;
      align-items: center;
      justify-content: center;
      background: rgba(13, 20, 17, .48);
      padding: 18px;
      z-index: 20;
    }
    .modal-backdrop.open { display: flex; }
    .modal {
      width: min(760px, 100%);
      max-height: min(86vh, 820px);
      overflow: auto;
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      box-shadow: 0 30px 80px rgba(0,0,0,.22);
      padding: 16px;
    }
    .modal.small { width: min(460px, 100%); }
    .modal-head {
      display: flex;
      justify-content: space-between;
      align-items: start;
      gap: 12px;
      margin-bottom: 14px;
      padding-bottom: 12px;
      border-bottom: 1px solid var(--line);
    }
    .modal-title { font-size: 18px; font-weight: 900; }
    .modal-sub { color: var(--muted); font-size: 12px; margin-top: 4px; overflow-wrap: anywhere; }
    .modal-actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 14px; flex-wrap: wrap; }
    .form-grid { display: grid; gap: 10px; }
    .form-row {
      display: grid;
      grid-template-columns: 170px minmax(0, 1fr) auto;
      gap: 8px;
      align-items: center;
      padding: 8px 0;
      border-bottom: 1px solid var(--line);
    }
    .form-row label { font-size: 12px; font-weight: 900; color: var(--muted); text-transform: uppercase; }
    .form-row textarea { min-height: 84px; resize: vertical; }
    .lock {
      display: inline-flex;
      gap: 6px;
      align-items: center;
      color: var(--muted);
      font-size: 12px;
      font-weight: 850;
    }
    .lock input { width: 18px; height: 18px; }
    .hint { color: var(--muted); font-size: 12px; line-height: 1.4; }
    .toast {
      position: fixed;
      right: 16px;
      bottom: 16px;
      z-index: 30;
      display: grid;
      gap: 8px;
      max-width: min(420px, calc(100vw - 32px));
    }
    .toast-item {
      background: var(--ink);
      color: #fff;
      border-radius: 8px;
      padding: 11px 13px;
      box-shadow: var(--shadow);
      font-weight: 800;
      font-size: 13px;
    }

    @media (max-width: 1040px) {
      .metrics { grid-template-columns: repeat(3, 1fr); }
      .layout { grid-template-columns: 1fr; }
      .side { position: static; }
    }
    @media (max-width: 720px) {
      .page { width: min(100% - 20px, 1440px); padding-top: 10px; }
      .topbar, .top-actions { align-items: stretch; flex-direction: column; }
      .metrics { grid-template-columns: repeat(2, 1fr); }
      .toolbar { grid-template-columns: 1fr; }
      .grid { grid-template-columns: 1fr; }
      .form-row { grid-template-columns: 1fr; }
      .card-actions { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    }
  </style>
</head>
<body>
  <div class="page">
    <header class="topbar">
      <div class="brand">
        <div class="mark">V</div>
        <div>
          <h1>Vishnu Control</h1>
          <div class="sub">BTPrint remote operations console</div>
        </div>
      </div>
      <div class="top-actions">
        <button id="refreshBtn" class="primary" type="button">Refresh</button>
        <button id="selectAllBtn" type="button">Show All</button>
        <a href="/logout">Logout</a>
      </div>
    </header>

    <section class="metrics" aria-label="Fleet status">
      <div class="metric"><div class="k">Machines</div><div class="v" id="mTotal">0</div></div>
      <div class="metric"><div class="k">Online</div><div class="v" id="mOnline">0</div></div>
      <div class="metric"><div class="k">Active</div><div class="v" id="mActive">0</div></div>
      <div class="metric"><div class="k">Paused</div><div class="v" id="mPaused">0</div></div>
      <div class="metric"><div class="k">Killed</div><div class="v" id="mKilled">0</div></div>
      <div class="metric"><div class="k">Pending</div><div class="v" id="mPending">0</div></div>
    </section>

    <section class="toolbar" aria-label="Fleet filters">
      <input id="searchInput" class="field" type="search" placeholder="Search machine, ID, IP, OS" />
      <select id="statusFilter" class="select" aria-label="Status filter">
        <option value="all">All statuses</option>
        <option value="online">Online only</option>
        <option value="offline">Offline only</option>
        <option value="active">Active</option>
        <option value="paused">Paused</option>
        <option value="killed">Killed</option>
        <option value="update_available">Update pending</option>
      </select>
      <select id="sortSelect" class="select" aria-label="Sort">
        <option value="recent">Recent heartbeat</option>
        <option value="name">Machine name</option>
        <option value="status">Status</option>
      </select>
      <button id="clearFiltersBtn" type="button">Clear Filters</button>
    </section>

    <main class="layout">
      <section id="machineGrid" class="grid" aria-label="Machines"></section>
      <aside class="side">
        <h2>Operations Feed</h2>
        <div class="hint" id="lastRefresh">Not refreshed yet</div>
        <div class="event-list" id="eventList" style="margin-top:12px;"></div>
      </aside>
    </main>
  </div>

  <div class="modal-backdrop" id="actionModal">
    <div class="modal small">
      <div class="modal-head">
        <div>
          <div class="modal-title" id="actionTitle">Command</div>
          <div class="modal-sub" id="actionSub"></div>
        </div>
        <button type="button" class="ghost" data-close-modal="actionModal">Close</button>
      </div>
      <div id="actionBody" class="form-grid"></div>
      <div class="modal-actions">
        <button type="button" data-close-modal="actionModal">Cancel</button>
        <button type="button" class="primary" id="actionConfirm">Send Command</button>
      </div>
    </div>
  </div>

  <div class="modal-backdrop" id="settingsModal">
    <div class="modal">
      <div class="modal-head">
        <div>
          <div class="modal-title">Remote Settings</div>
          <div class="modal-sub" id="settingsSub"></div>
        </div>
        <button type="button" class="ghost" data-close-modal="settingsModal">Close</button>
      </div>
      <div class="hint" id="settingsHint"></div>
      <div class="form-grid" id="settingsForm" style="margin-top:10px;"></div>
      <div class="modal-actions">
        <button type="button" id="clearPendingBtn" class="warn">Clear Pending</button>
        <button type="button" id="clearPendingLocksBtn" class="warn">Clear Pending + Locks</button>
        <button type="button" id="pushSettingsBtn" class="primary">Push Settings</button>
      </div>
    </div>
  </div>

  <div class="toast" id="toast"></div>

  <script>
    const initialSoftwares = {{ softwares | tojson | safe }};
    let softwares = initialSoftwares || {};
    let filterStatus = 'all';
    let searchText = '';
    let sortMode = 'recent';
    let actionState = null;
    let settingsState = null;
    const notesTimers = new Map();
    const events = [];

    const SETTINGS_FIELDS = [
      { key: 'active_bom', label: 'Active BOM', type: 'text', placeholder: 'BOM_Rev1.xlsx' },
      { key: 'printer', label: 'Printer Name', type: 'text', placeholder: 'ZDesigner ZT230' },
      { key: 'btw_file', label: 'Fallback BTW', type: 'text', placeholder: 'C:\\Labels\\template.btw' },
      { key: 'templates.polaris', label: 'Polaris BTW', type: 'text', placeholder: 'C:\\Labels\\polaris.btw' },
      { key: 'templates.minda', label: 'Minda BTW', type: 'text', placeholder: 'C:\\Labels\\minda.btw' },
      { key: 'templates.solder', label: 'Solder BTW', type: 'text', placeholder: 'C:\\Labels\\solder.btw' },
      { key: 'last_mode', label: 'Default Mode', type: 'text', placeholder: 'manual' },
      { key: 'column_mapping', label: 'Polaris Mapping', type: 'json', placeholder: '[{"column":"A","header":"BTPRINT","source":"label_data"}]' },
      { key: 'minda_column_mapping', label: 'Minda Mapping', type: 'json', placeholder: '[{"column":"A","header":"BTPRINT","source":"label_data"}]' },
    ];

    function escapeHtml(value) {
      if (value === null || value === undefined) return '';
      return String(value).replace(/[&<>"']/g, ch => ({
        '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#039;'
      }[ch]));
    }

    function domId(value) {
      return String(value || 'unknown').replace(/[^A-Za-z0-9_-]/g, '_');
    }

    function getNested(obj, key) {
      const parts = key.split('.');
      let val = obj || {};
      for (const part of parts) {
        if (val === null || val === undefined) return '';
        val = val[part];
      }
      if (val === null || val === undefined) return '';
      if (typeof val === 'object') return JSON.stringify(val, null, 2);
      return String(val);
    }

    function setNested(obj, key, value) {
      const parts = key.split('.');
      let target = obj;
      while (parts.length > 1) {
        const part = parts.shift();
        target[part] = target[part] || {};
        target = target[part];
      }
      target[parts[0]] = value;
    }

    function displayStatus(machine) {
      if (!machine.online && machine.status === 'active') return 'offline';
      return machine.status || 'active';
    }

    function statusLabel(status) {
      return status === 'update_available' ? 'update' : status;
    }

    function timeLabel(epoch) {
      if (!epoch) return '--';
      const seconds = Math.max(0, Math.floor(Date.now() / 1000 - Number(epoch)));
      if (seconds < 60) return `${seconds}s ago`;
      if (seconds < 3600) return `${Math.floor(seconds / 60)}m ago`;
      return `${Math.floor(seconds / 3600)}h ago`;
    }

    function pauseLabel(epoch) {
      if (!epoch) return 'Manual resume';
      const seconds = Math.max(0, Math.floor(Number(epoch) - Date.now() / 1000));
      if (seconds < 60) return `${seconds}s left`;
      return `${Math.ceil(seconds / 60)}m left`;
    }

    function toast(message) {
      const host = document.getElementById('toast');
      const item = document.createElement('div');
      item.className = 'toast-item';
      item.textContent = message;
      host.appendChild(item);
      setTimeout(() => item.remove(), 3600);
    }

    function pushEvent(title, body) {
      events.unshift({ title, body, at: new Date().toLocaleTimeString() });
      events.splice(8);
      renderEvents();
    }

    function renderEvents() {
      const list = document.getElementById('eventList');
      if (!events.length) {
        list.innerHTML = '<div class="event">No command activity in this browser session.</div>';
        return;
      }
      list.innerHTML = events.map(e => `
        <div class="event"><strong>${escapeHtml(e.title)}</strong><br>${escapeHtml(e.body)}<br>${escapeHtml(e.at)}</div>
      `).join('');
    }

    async function apiList() {
      const res = await fetch('/api/admin/list');
      const data = await res.json().catch(() => ({}));
      if (!res.ok) throw new Error(data.error || 'List failed');
      return data.softwares || {};
    }

    async function postJSON(url, body) {
      const res = await fetch(url, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(body || {}),
      });
      const data = await res.json().catch(() => ({}));
      if (!res.ok) throw new Error(data.error || 'Request failed');
      return data;
    }

    function getFilteredMachines() {
      let list = Object.values(softwares || {});
      if (filterStatus !== 'all') {
        list = list.filter(m => displayStatus(m) === filterStatus);
      }
      if (searchText) {
        const q = searchText.toLowerCase();
        list = list.filter(m => [
          m.software_id, m.machine_name, m.ip_address, m.os_name, m.version, m.status
        ].some(v => String(v || '').toLowerCase().includes(q)));
      }
      list.sort((a, b) => {
        if (sortMode === 'name') return String(a.machine_name || '').localeCompare(String(b.machine_name || ''));
        if (sortMode === 'status') return String(displayStatus(a)).localeCompare(String(displayStatus(b)));
        return Number(b.last_seen || 0) - Number(a.last_seen || 0);
      });
      return list;
    }

    function computeMetrics() {
      const list = Object.values(softwares || {});
      return {
        total: list.length,
        online: list.filter(m => m.online).length,
        active: list.filter(m => displayStatus(m) === 'active').length,
        paused: list.filter(m => displayStatus(m) === 'paused').length,
        killed: list.filter(m => displayStatus(m) === 'killed').length,
        pending: list.reduce((sum, m) => sum + Number(m.pending_count || 0), 0),
      };
    }

    function renderMetrics() {
      const m = computeMetrics();
      document.getElementById('mTotal').textContent = m.total;
      document.getElementById('mOnline').textContent = m.online;
      document.getElementById('mActive').textContent = m.active;
      document.getElementById('mPaused').textContent = m.paused;
      document.getElementById('mKilled').textContent = m.killed;
      document.getElementById('mPending').textContent = m.pending;
    }

    function machineCard(machine) {
      const id = String(machine.software_id || '');
      const status = displayStatus(machine);
      const name = machine.machine_name || id || 'Unknown machine';
      const last = timeLabel(machine.last_seen);
      const pauseInfo = status === 'paused' ? `<div><div class="k">Pause</div><div class="v">${escapeHtml(pauseLabel(machine.pause_until))}</div></div>` : '';
      const pending = Number(machine.pending_count || 0);
      const locked = Number(machine.locked_count || 0);
      return `
        <article class="machine ${escapeHtml(status)} ${machine.online ? '' : 'offline'}" data-machine-id="${escapeHtml(id)}">
          <div class="machine-head">
            <div>
              <div class="machine-name">${escapeHtml(name)}</div>
              <div class="machine-id">${escapeHtml(id)}</div>
            </div>
            <span class="badge ${escapeHtml(status)}"><span class="dot"></span>${escapeHtml(statusLabel(status))}</span>
          </div>
          <div class="kv">
            <div><div class="k">Version</div><div class="v">${escapeHtml(machine.version || '--')}</div></div>
            <div><div class="k">IP</div><div class="v">${escapeHtml(machine.ip_address || '--')}</div></div>
            <div><div class="k">OS</div><div class="v">${escapeHtml(machine.os_name || '--')}</div></div>
            <div><div class="k">Heartbeat</div><div class="v">${escapeHtml(last)}</div></div>
            <div><div class="k">Pending</div><div class="v">${pending} setting${pending === 1 ? '' : 's'}</div></div>
            <div><div class="k">Locks</div><div class="v">${locked} lock${locked === 1 ? '' : 's'}</div></div>
            ${pauseInfo}
          </div>
          <div class="card-actions">
            <button class="good" data-action="activate" data-id="${escapeHtml(id)}" type="button">Activate</button>
            <button class="warn" data-action="pause" data-id="${escapeHtml(id)}" type="button">Pause</button>
            <button class="danger" data-action="kill" data-id="${escapeHtml(id)}" type="button">Kill</button>
            <button data-action="settings" data-id="${escapeHtml(id)}" type="button">Settings</button>
            <button data-action="update" data-id="${escapeHtml(id)}" type="button">Update</button>
            <button data-action="clear" data-id="${escapeHtml(id)}" type="button">Clear</button>
          </div>
          <div class="note-row">
            <label for="note-${domId(id)}">Notes</label>
            <textarea id="note-${domId(id)}" data-note-id="${escapeHtml(id)}" placeholder="Admin note">${escapeHtml(machine.notes || '')}</textarea>
          </div>
        </article>
      `;
    }

    function renderMachines() {
      renderMetrics();
      const list = getFilteredMachines();
      const grid = document.getElementById('machineGrid');
      if (!list.length) {
        grid.innerHTML = '<div class="empty">No machines match the current filters.</div>';
        return;
      }
      grid.innerHTML = list.map(machineCard).join('');
    }

    async function refresh() {
      softwares = await apiList();
      document.getElementById('lastRefresh').textContent = `Last refresh: ${new Date().toLocaleTimeString()}`;
      renderMachines();
    }

    function openActionModal(type, id) {
      actionState = { type, id };
      const machine = softwares[id] || {};
      const title = type === 'pause' ? 'Pause BTPrint' : type === 'kill' ? 'Kill BTPrint' : 'Flag Update';
      document.getElementById('actionTitle').textContent = title;
      document.getElementById('actionSub').textContent = `${id} on ${machine.machine_name || 'unknown machine'}`;
      const body = document.getElementById('actionBody');
      if (type === 'pause') {
        body.innerHTML = `
          <label class="hint" for="pauseMinutes">Pause minutes</label>
          <input class="field" id="pauseMinutes" type="number" min="0" step="1" value="30" />
          <label class="hint" for="pauseReason">Reason</label>
          <input class="field" id="pauseReason" type="text" placeholder="Maintenance window" />
        `;
      } else if (type === 'kill') {
        body.innerHTML = `
          <label class="hint" for="killReason">Reason</label>
          <input class="field" id="killReason" type="text" placeholder="Emergency stop" />
        `;
      } else {
        body.innerHTML = `
          <label class="hint" for="updateUrl">Update URL</label>
          <input class="field" id="updateUrl" type="url" placeholder="https://example.com/update.zip" />
        `;
      }
      document.getElementById('actionModal').classList.add('open');
    }

    async function confirmAction() {
      if (!actionState) return;
      const { type, id } = actionState;
      if (type === 'pause') {
        const pause_minutes = Number(document.getElementById('pauseMinutes').value || 0);
        const reason = document.getElementById('pauseReason').value.trim();
        await postJSON('/api/admin/pause', { software_id: id, pause_minutes, reason });
      } else if (type === 'kill') {
        const reason = document.getElementById('killReason').value.trim();
        await postJSON('/api/admin/kill', { software_id: id, reason });
      } else {
        const update_url = document.getElementById('updateUrl').value.trim();
        if (!update_url) throw new Error('Update URL is required');
        await postJSON('/api/admin/update', { software_id: id, update_url });
      }
      closeModal('actionModal');
      pushEvent(type.toUpperCase(), id);
      toast('Command sent');
      await refresh();
    }

    async function openSettings(id) {
      settingsState = { id, current: {}, pending: {}, locked: [] };
      document.getElementById('settingsSub').textContent = id;
      document.getElementById('settingsHint').textContent = 'Loading current and pending values.';
      document.getElementById('settingsForm').innerHTML = '';
      document.getElementById('settingsModal').classList.add('open');
      const res = await fetch('/api/admin/settings/' + encodeURIComponent(id));
      const data = await res.json().catch(() => ({}));
      if (!res.ok) throw new Error(data.error || 'Settings load failed');
      settingsState.current = data.current_settings || {};
      settingsState.pending = data.pending_settings || {};
      settingsState.locked = data.locked_settings || [];
      document.getElementById('settingsHint').textContent = Object.keys(settingsState.pending || {}).length
        ? 'Pending values detected.'
        : 'No pending values.';
      renderSettingsForm();
    }

    function renderSettingsForm() {
      const form = document.getElementById('settingsForm');
      form.innerHTML = SETTINGS_FIELDS.map(field => {
        const pending = getNested(settingsState.pending, field.key);
        const current = getNested(settingsState.current, field.key);
        const value = pending || current;
        const locked = settingsState.locked.includes(field.key) || settingsState.locked.includes(field.key.split('.')[0]);
        const input = field.type === 'json'
          ? `<textarea class="field" data-setting-key="${escapeHtml(field.key)}" placeholder="${escapeHtml(field.placeholder)}">${escapeHtml(value)}</textarea>`
          : `<input class="field" data-setting-key="${escapeHtml(field.key)}" type="text" value="${escapeHtml(value)}" placeholder="${escapeHtml(field.placeholder)}" />`;
        return `
          <div class="form-row">
            <label>${escapeHtml(field.label)}</label>
            <div>
              ${input}
              <div class="hint">Current: ${escapeHtml(current || '--')}</div>
            </div>
            <label class="lock"><input type="checkbox" data-lock-key="${escapeHtml(field.key)}" ${locked ? 'checked' : ''} /> Lock</label>
          </div>
        `;
      }).join('');
    }

    async function pushSettings() {
      if (!settingsState) return;
      const settings = {};
      const inputs = document.querySelectorAll('[data-setting-key]');
      for (const input of inputs) {
        const key = input.getAttribute('data-setting-key');
        let value = input.value.trim();
        if (!value) continue;
        const field = SETTINGS_FIELDS.find(f => f.key === key);
        if (field && field.type === 'json') {
          try { value = JSON.parse(value); }
          catch (err) {
            input.focus();
            throw new Error(`Invalid JSON for ${field.label}`);
          }
        }
        setNested(settings, key, value);
      }
      const locked = Array.from(document.querySelectorAll('[data-lock-key]:checked')).map(el => el.getAttribute('data-lock-key'));
      await postJSON('/api/admin/settings', {
        software_id: settingsState.id,
        settings: Object.keys(settings).length ? settings : undefined,
        locked_settings: locked,
      });
      pushEvent('SETTINGS', settingsState.id);
      toast('Settings queued for next heartbeat');
      await openSettings(settingsState.id);
      await refresh();
    }

    async function clearPending(id, clearLocks = false) {
      await postJSON('/api/admin/clear_pending', { software_id: id, clear_locks: clearLocks });
      pushEvent('CLEAR', clearLocks ? `${id}: pending and locks` : `${id}: pending only`);
      toast('Pending queue cleared');
      await refresh();
      if (settingsState && settingsState.id === id) await openSettings(id);
    }

    function closeModal(id) {
      document.getElementById(id).classList.remove('open');
      if (id === 'actionModal') actionState = null;
    }

    document.addEventListener('click', async event => {
      const close = event.target.closest('[data-close-modal]');
      if (close) {
        closeModal(close.getAttribute('data-close-modal'));
        return;
      }

      const actionButton = event.target.closest('[data-action]');
      if (!actionButton) return;
      const action = actionButton.getAttribute('data-action');
      const id = actionButton.getAttribute('data-id');
      try {
        if (action === 'activate') {
          await postJSON('/api/admin/activate', { software_id: id });
          pushEvent('ACTIVATE', id);
          toast('Machine activated');
          await refresh();
        } else if (action === 'pause' || action === 'kill' || action === 'update') {
          openActionModal(action, id);
        } else if (action === 'settings') {
          await openSettings(id);
        } else if (action === 'clear') {
          await clearPending(id, false);
        }
      } catch (err) {
        toast(err.message || 'Command failed');
      }
    });

    document.addEventListener('input', event => {
      const note = event.target.closest('[data-note-id]');
      if (!note) return;
      const id = note.getAttribute('data-note-id');
      clearTimeout(notesTimers.get(id));
      notesTimers.set(id, setTimeout(async () => {
        try { await postJSON('/api/admin/save_notes', { software_id: id, notes: note.value }); }
        catch (err) { toast('Note save failed'); }
      }, 700));
    });

    document.getElementById('actionConfirm').addEventListener('click', async () => {
      try { await confirmAction(); }
      catch (err) { toast(err.message || 'Command failed'); }
    });
    document.getElementById('pushSettingsBtn').addEventListener('click', async () => {
      try { await pushSettings(); }
      catch (err) { toast(err.message || 'Settings failed'); }
    });
    document.getElementById('clearPendingBtn').addEventListener('click', async () => {
      try { if (settingsState) await clearPending(settingsState.id, false); }
      catch (err) { toast(err.message || 'Clear failed'); }
    });
    document.getElementById('clearPendingLocksBtn').addEventListener('click', async () => {
      try { if (settingsState) await clearPending(settingsState.id, true); }
      catch (err) { toast(err.message || 'Clear failed'); }
    });
    document.getElementById('refreshBtn').addEventListener('click', async () => {
      try { await refresh(); toast('Refreshed'); }
      catch (err) { toast(err.message || 'Refresh failed'); }
    });
    document.getElementById('selectAllBtn').addEventListener('click', () => {
      filterStatus = 'all';
      searchText = '';
      document.getElementById('statusFilter').value = 'all';
      document.getElementById('searchInput').value = '';
      renderMachines();
    });
    document.getElementById('clearFiltersBtn').addEventListener('click', () => {
      filterStatus = 'all';
      searchText = '';
      sortMode = 'recent';
      document.getElementById('statusFilter').value = 'all';
      document.getElementById('searchInput').value = '';
      document.getElementById('sortSelect').value = 'recent';
      renderMachines();
    });
    document.getElementById('statusFilter').addEventListener('change', event => {
      filterStatus = event.target.value;
      renderMachines();
    });
    document.getElementById('sortSelect').addEventListener('change', event => {
      sortMode = event.target.value;
      renderMachines();
    });
    document.getElementById('searchInput').addEventListener('input', event => {
      searchText = event.target.value.trim();
      renderMachines();
    });

    renderEvents();
    renderMachines();
    refresh().catch(err => toast(err.message || 'Initial refresh failed'));
    setInterval(() => refresh().catch(() => {}), 15000);
  </script>
</body>
</html>
