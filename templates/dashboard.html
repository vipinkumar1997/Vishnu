<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Remote Software Control - Dashboard</title>
  <!-- Outfit Google Font -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
  
  <style>
    :root{
      --bg: #080c14;
      --glass-bg: rgba(18, 26, 47, 0.45);
      --glass-border: rgba(255, 255, 255, 0.08);
      --glass-glow: rgba(79, 140, 255, 0.05);
      --text: #f0f4f9;
      --muted: #94a3b8;
      
      --accent: #4f8cff;
      --accent-glow: rgba(79, 140, 255, 0.25);
      
      --green: #10b981;
      --green-glow: rgba(16, 185, 129, 0.15);
      
      --red: #f43f5e;
      --red-glow: rgba(244, 63, 94, 0.15);
      
      --orange: #f59e0b;
      --orange-glow: rgba(245, 158, 11, 0.15);

      --radius-lg: 20px;
      --radius-md: 14px;
      
      --transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    }

    *{ 
      box-sizing: border-box; 
      margin: 0; 
      padding: 0;
    }

    body{
      background: radial-gradient(circle at 10% 20%, rgba(15, 23, 42, 0.8) 0%, rgba(8, 12, 20, 1) 90%), var(--bg);
      color: var(--text);
      font-family: 'Outfit', system-ui, -apple-system, sans-serif;
      min-height: 100vh;
      overflow-x: hidden;
      padding-bottom: 60px;
    }

    .page{ 
      padding: 24px; 
      max-width: 1240px; 
      margin: 0 auto; 
    }

    /* Header */
    .header{
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
      padding: 20px 24px;
      border-radius: var(--radius-lg);
      background: var(--glass-bg);
      border: 1px solid var(--glass-border);
      -webkit-backdrop-filter: blur(16px);
      backdrop-filter: blur(16px);
      box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.3);
      margin-bottom: 24px;
    }
    
    .title-wrap{ 
      display: flex; 
      flex-direction: column; 
      gap: 6px; 
    }
    
    .title{
      display: flex; 
      align-items: center; 
      gap: 12px;
      font-weight: 800;
      font-size: 22px;
      letter-spacing: -0.5px;
    }

    .title span.icon {
      display: inline-flex;
      width: 32px;
      height: 32px;
      align-items: center;
      justify-content: center;
      border-radius: var(--radius-md);
      background: var(--accent-glow);
      border: 1px solid rgba(79, 140, 255, 0.3);
      color: var(--accent);
      font-weight: bold;
    }
    
    .sub{
      font-size: 13px;
      color: var(--muted);
    }

    .logout{
      text-decoration: none;
      color: var(--text);
      font-weight: 700;
      font-size: 14px;
      padding: 10px 20px;
      border-radius: var(--radius-md);
      border: 1px solid var(--glass-border);
      background: rgba(255, 255, 255, 0.03);
      transition: var(--transition);
      cursor: pointer;
    }
    .logout:hover{ 
      border-color: var(--red); 
      background: rgba(244, 63, 94, 0.1);
      box-shadow: 0 0 15px rgba(244, 63, 94, 0.2);
    }

    /* Top stats row */
    .stats{
      display: grid;
      grid-template-columns: repeat(4, minmax(180px, 1fr));
      gap: 16px;
      margin-bottom: 24px;
    }

    .stat-card{
      background: var(--glass-bg);
      border: 1px solid var(--glass-border);
      border-radius: var(--radius-lg);
      padding: 20px;
      box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.2);
      -webkit-backdrop-filter: blur(12px);
      backdrop-filter: blur(12px);
      transition: var(--transition);
    }
    .stat-card:hover{
      transform: translateY(-2px);
      border-color: rgba(255, 255, 255, 0.15);
    }
    .stat-k{ color: var(--muted); font-size: 13px; font-weight: 500; margin-bottom: 8px; }
    .stat-v{ font-size: 28px; font-weight: 900; letter-spacing: -0.5px; }

    /* Control Bar (Search, Filters, Sort) */
    .control-bar{
      display: flex;
      flex-wrap: wrap;
      gap: 16px;
      align-items: center;
      justify-content: space-between;
      background: var(--glass-bg);
      border: 1px solid var(--glass-border);
      border-radius: var(--radius-lg);
      padding: 16px 20px;
      margin-bottom: 24px;
      -webkit-backdrop-filter: blur(12px);
      backdrop-filter: blur(12px);
    }

    .search-input-wrap {
      flex: 1;
      min-width: 260px;
      position: relative;
    }

    .search-input-wrap input {
      width: 100%;
      padding: 12px 16px 12px 42px;
      border-radius: var(--radius-md);
      border: 1px solid var(--glass-border);
      background: rgba(0, 0, 0, 0.2);
      color: var(--text);
      font-family: inherit;
      font-size: 14px;
      outline: none;
      transition: var(--transition);
    }
    .search-input-wrap input:focus {
      border-color: var(--accent);
      box-shadow: 0 0 15px var(--accent-glow);
    }
    .search-input-wrap::before {
      content: "🔍";
      position: absolute;
      left: 16px;
      top: 50%;
      transform: translateY(-50%);
      font-size: 14px;
      opacity: 0.6;
    }

    .filter-tabs {
      display: flex;
      gap: 8px;
    }

    .filter-tab {
      background: rgba(255, 255, 255, 0.02);
      border: 1px solid var(--glass-border);
      color: var(--muted);
      padding: 10px 16px;
      border-radius: var(--radius-md);
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: var(--transition);
    }
    .filter-tab:hover {
      color: var(--text);
      border-color: rgba(255, 255, 255, 0.15);
    }
    .filter-tab.active {
      background: var(--accent-glow);
      border-color: var(--accent);
      color: #fff;
      box-shadow: 0 0 15px rgba(79, 140, 255, 0.15);
    }

    .sort-wrap {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .sort-wrap label {
      font-size: 13px;
      color: var(--muted);
      font-weight: 500;
    }

    .sort-select {
      background: rgba(0, 0, 0, 0.2);
      border: 1px solid var(--glass-border);
      color: var(--text);
      padding: 10px 14px;
      border-radius: var(--radius-md);
      font-family: inherit;
      font-size: 14px;
      outline: none;
      cursor: pointer;
    }

    /* Grid */
    .grid{
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 20px;
    }

    @media (max-width: 900px){
      .stats{ grid-template-columns: repeat(2, minmax(160px, 1fr)); }
      .grid{ grid-template-columns: 1fr; }
      .control-bar { flex-direction: column; align-items: stretch; }
      .filter-tabs { overflow-x: auto; padding-bottom: 4px; }
    }

    .soft-card{
      background: var(--glass-bg);
      border: 1px solid var(--glass-border);
      border-radius: var(--radius-lg);
      padding: 20px;
      box-shadow: 0 12px 36px rgba(0,0,0,0.25);
      -webkit-backdrop-filter: blur(16px);
      backdrop-filter: blur(16px);
      transition: var(--transition);
      position: relative;
      overflow: hidden;
    }
    .soft-card::before {
      content: "";
      position: absolute;
      top: 0;
      left: 0;
      width: 4px;
      height: 100%;
      background: var(--accent);
      transition: var(--transition);
    }
    .soft-card.card-active::before { background: var(--green); }
    .soft-card.card-killed::before { background: var(--red); }
    .soft-card.card-update_available::before { background: var(--orange); }

    .soft-card:hover{
      transform: translateY(-4px);
      box-shadow: 0 20px 40px rgba(0,0,0,0.35);
      border-color: rgba(255, 255, 255, 0.15);
    }

    .soft-top{
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 18px;
    }

    .soft-name{
      font-size: 17px;
      font-weight: 800;
      line-height: 1.25;
      letter-spacing: -0.2px;
    }

    .badge{
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 6px 14px;
      border-radius: 999px;
      font-size: 11px;
      font-weight: 800;
      border: 1px solid transparent;
      letter-spacing: 0.5px;
      text-transform: uppercase;
    }

    .badge-active{ background: var(--green-glow); border-color: rgba(16,185,129,0.3); color: #6ee7b7; }
    .badge-killed{ background: var(--red-glow); border-color: rgba(244,63,94,0.3); color: #fda4af; }
    .badge-update{ background: var(--orange-glow); border-color: rgba(245,158,11,0.3); color: #fde047; }

    .info-grid{
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 12px;
      margin-bottom: 18px;
    }

    .info{
      background: rgba(255,255,255,0.015);
      border: 1px solid rgba(255,255,255,0.04);
      border-radius: var(--radius-md);
      padding: 12px;
      transition: var(--transition);
    }
    .info:hover {
      background: rgba(255,255,255,0.03);
    }

    .info .k{ color: var(--muted); font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 6px; }
    .info .v{ font-size: 14px; font-weight: 700; word-break: break-all; }

    .info-last{ grid-column: 1 / -1; }

    .note{
      margin-bottom: 18px;
      background: rgba(255,255,255,0.015);
      border: 1px solid rgba(255,255,255,0.04);
      border-radius: var(--radius-md);
      padding: 12px;
      position: relative;
    }
    .note .k-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 8px;
    }
    .note .k{ color: var(--muted); font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.5px; }
    
    .save-indicator {
      font-size: 11px;
      color: var(--muted);
      font-weight: 500;
      transition: var(--transition);
    }
    .save-indicator.saving { color: var(--orange); }
    .save-indicator.saved { color: var(--green); }

    textarea{
      width: 100%;
      resize: vertical;
      min-height: 60px;
      max-height: 180px;
      background: transparent;
      border: 0;
      outline: none;
      color: var(--text);
      font-family: inherit;
      font-weight: 500;
      font-size: 13.5px;
      line-height: 1.5;
    }

    .btn-row{ display: flex; gap: 10px; }

    .btn{
      border-radius: var(--radius-md);
      padding: 12px 14px;
      border: 1px solid var(--glass-border);
      background: rgba(255,255,255,0.03);
      color: var(--text);
      font-family: inherit;
      font-weight: 700;
      font-size: 13px;
      cursor: pointer;
      flex: 1;
      transition: var(--transition);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }
    .btn:hover{ border-color: rgba(255,255,255,0.2); background: rgba(255,255,255,0.06); }

    .btn-kill{ background: rgba(244, 63, 94, 0.08); border-color: rgba(244, 63, 94, 0.2); color: #fda4af; }
    .btn-kill:hover{ background: rgba(244, 63, 94, 0.16); border-color: var(--red); box-shadow: 0 0 15px rgba(244,63,94,0.15); }
    
    .btn-activate{ background: rgba(16, 185, 129, 0.08); border-color: rgba(16, 185, 129, 0.2); color: #6ee7b7; }
    .btn-activate:hover{ background: rgba(16, 185, 129, 0.16); border-color: var(--green); box-shadow: 0 0 15px rgba(16,185,129,0.15); }
    
    .btn-update{ background: rgba(245, 158, 11, 0.08); border-color: rgba(245, 158, 11, 0.2); color: #fde047; }
    .btn-update:hover{ background: rgba(245, 158, 11, 0.16); border-color: var(--orange); box-shadow: 0 0 15px rgba(245,158,11,0.15); }

    /* Modals (Glassmorphic Popups) */
    .modal-backdrop {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(4, 8, 16, 0.7);
      -webkit-backdrop-filter: blur(12px);
      backdrop-filter: blur(12px);
      z-index: 100;
      display: flex;
      align-items: center;
      justify-content: center;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s ease;
    }
    .modal-backdrop.open {
      opacity: 1;
      pointer-events: auto;
    }

    .modal {
      background: rgba(15, 23, 42, 0.85);
      border: 1px solid var(--glass-border);
      border-radius: var(--radius-lg);
      width: 90%;
      max-width: 440px;
      padding: 24px;
      box-shadow: 0 24px 64px rgba(0,0,0,0.5);
      transform: scale(0.9);
      transition: transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
    }
    .modal-backdrop.open .modal {
      transform: scale(1);
    }

    .modal-title {
      font-size: 19px;
      font-weight: 800;
      margin-bottom: 12px;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    
    .modal-body {
      margin-bottom: 20px;
    }

    .modal-body label {
      display: block;
      font-size: 13px;
      color: var(--muted);
      margin-bottom: 8px;
      font-weight: 500;
    }

    .modal-input {
      width: 100%;
      padding: 12px 14px;
      border-radius: var(--radius-md);
      border: 1px solid var(--glass-border);
      background: rgba(0, 0, 0, 0.3);
      color: var(--text);
      font-family: inherit;
      font-size: 14px;
      outline: none;
      transition: var(--transition);
    }
    .modal-input:focus {
      border-color: var(--accent);
      box-shadow: 0 0 15px var(--accent-glow);
    }

    .modal-btns {
      display: flex;
      gap: 12px;
      justify-content: flex-end;
    }
    
    .modal-btn {
      padding: 10px 20px;
      font-weight: 700;
      border-radius: var(--radius-md);
      cursor: pointer;
      font-family: inherit;
      font-size: 14px;
      border: 1px solid transparent;
      transition: var(--transition);
    }
    .modal-btn-cancel {
      background: transparent;
      border-color: var(--glass-border);
      color: var(--muted);
    }
    .modal-btn-cancel:hover {
      color: var(--text);
      border-color: rgba(255, 255, 255, 0.2);
    }
    
    /* Toast System */
    .toast-container {
      position: fixed;
      bottom: 24px;
      right: 24px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      z-index: 1000;
    }

    .toast {
      background: rgba(15, 23, 42, 0.9);
      border: 1px solid var(--glass-border);
      padding: 14px 20px;
      border-radius: var(--radius-md);
      box-shadow: 0 10px 30px rgba(0,0,0,0.3);
      -webkit-backdrop-filter: blur(10px);
      backdrop-filter: blur(10px);
      display: flex;
      align-items: center;
      gap: 10px;
      transform: translateX(120%);
      transition: transform 0.35s cubic-bezier(0.34, 1.56, 0.64, 1);
      font-size: 14px;
      font-weight: 600;
      pointer-events: auto;
    }
    .toast.show {
      transform: translateX(0);
    }
    .toast-success {
      border-color: var(--green);
      color: #6ee7b7;
    }
    .toast-error {
      border-color: var(--red);
      color: #fda4af;
    }
    .toast-info {
      border-color: var(--accent);
      color: #93c5fd;
    }

    .no-results {
      grid-column: 1 / -1;
      text-align: center;
      padding: 60px 20px;
      color: var(--muted);
      font-size: 16px;
      background: var(--glass-bg);
      border: 1px solid var(--glass-border);
      border-radius: var(--radius-lg);
    }

    /* Settings Modal — wider */
    .modal-settings {
      max-width: 640px;
    }

    .settings-form {
      display: flex;
      flex-direction: column;
      gap: 14px;
      max-height: 55vh;
      overflow-y: auto;
      padding-right: 8px;
      margin-bottom: 20px;
    }
    .settings-form::-webkit-scrollbar { width: 5px; }
    .settings-form::-webkit-scrollbar-track { background: transparent; }
    .settings-form::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.1); border-radius: 10px; }

    .setting-row {
      display: flex;
      align-items: flex-start;
      gap: 10px;
      background: rgba(255,255,255,0.015);
      border: 1px solid rgba(255,255,255,0.04);
      border-radius: var(--radius-md);
      padding: 14px;
      transition: var(--transition);
    }
    .setting-row:hover {
      background: rgba(255,255,255,0.03);
    }
    .setting-row.is-locked {
      border-color: rgba(244, 63, 94, 0.25);
      background: rgba(244, 63, 94, 0.04);
    }

    .setting-info {
      flex: 1;
      min-width: 0;
    }

    .setting-label {
      font-size: 12px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: var(--muted);
      margin-bottom: 4px;
    }

    .setting-current {
      font-size: 11px;
      color: rgba(148, 163, 184, 0.6);
      margin-bottom: 8px;
      word-break: break-all;
      font-style: italic;
    }

    .setting-input {
      width: 100%;
      padding: 10px 12px;
      border-radius: 10px;
      border: 1px solid var(--glass-border);
      background: rgba(0, 0, 0, 0.25);
      color: var(--text);
      font-family: inherit;
      font-size: 13px;
      outline: none;
      transition: var(--transition);
    }
    .setting-input:focus {
      border-color: var(--accent);
      box-shadow: 0 0 12px var(--accent-glow);
    }

    .setting-textarea {
      width: 100%;
      min-height: 60px;
      max-height: 120px;
      resize: vertical;
      padding: 10px 12px;
      border-radius: 10px;
      border: 1px solid var(--glass-border);
      background: rgba(0, 0, 0, 0.25);
      color: var(--text);
      font-family: 'Courier New', monospace;
      font-size: 12px;
      outline: none;
      transition: var(--transition);
    }
    .setting-textarea:focus {
      border-color: var(--accent);
      box-shadow: 0 0 12px var(--accent-glow);
    }

    .lock-btn {
      width: 38px;
      height: 38px;
      min-width: 38px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 10px;
      border: 1px solid var(--glass-border);
      background: rgba(255,255,255,0.02);
      cursor: pointer;
      font-size: 16px;
      transition: var(--transition);
      margin-top: 22px;
    }
    .lock-btn:hover {
      border-color: rgba(255,255,255,0.2);
      background: rgba(255,255,255,0.06);
    }
    .lock-btn.locked {
      background: rgba(244, 63, 94, 0.15);
      border-color: rgba(244, 63, 94, 0.4);
      box-shadow: 0 0 12px rgba(244, 63, 94, 0.15);
    }

    .pending-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 6px 12px;
      border-radius: 999px;
      font-size: 11px;
      font-weight: 700;
      background: rgba(245, 158, 11, 0.12);
      border: 1px solid rgba(245, 158, 11, 0.3);
      color: #fde047;
      margin-left: 10px;
    }

    .settings-header-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 16px;
    }

    .settings-subtitle {
      font-size: 13px;
      color: var(--muted);
      font-weight: 500;
    }

    .btn-settings {
      background: rgba(79, 140, 255, 0.08);
      border-color: rgba(79, 140, 255, 0.2);
      color: #93c5fd;
    }
    .btn-settings:hover {
      background: rgba(79, 140, 255, 0.16);
      border-color: var(--accent);
      box-shadow: 0 0 15px rgba(79, 140, 255, 0.15);
    }
  </style>
</head>
<body>
  <div class="page">
    
    <!-- Top Header -->
    <div class="header">
      <div class="title-wrap">
        <div class="title">
          <span class="icon">▦</span>
          <span>Remote Software Control</span>
        </div>
        <div class="sub">
          Auto-refresh active · Last updated: <span id="lastUpdatedText">--</span>
        </div>
      </div>
      <a class="logout" href="/logout">Logout</a>
    </div>

    <!-- Stats Bar -->
    <div class="stats">
      <div class="stat-card">
        <div class="stat-k">Total Softwares</div>
        <div class="stat-v" id="statTotal">0</div>
      </div>
      <div class="stat-card" style="border-color: rgba(16, 185, 129, 0.15);">
        <div class="stat-k" style="color: #6ee7b7;">Active</div>
        <div class="stat-v" id="statActive" style="color: var(--green);">0</div>
      </div>
      <div class="stat-card" style="border-color: rgba(244, 63, 94, 0.15);">
        <div class="stat-k" style="color: #fda4af;">Killed</div>
        <div class="stat-v" id="statKilled" style="color: var(--red);">0</div>
      </div>
      <div class="stat-card">
        <div class="stat-k">Last Activity</div>
        <div class="stat-v" id="statLastActivity">--</div>
      </div>
    </div>

    <!-- Search / Filter / Sort Panel -->
    <div class="control-bar">
      <div class="search-input-wrap">
        <input type="text" id="searchInput" placeholder="Search by machine name, ID, IP or OS..." />
      </div>
      
      <div class="filter-tabs">
        <button class="filter-tab active" data-filter="all">All</button>
        <button class="filter-tab" data-filter="active">Active</button>
        <button class="filter-tab" data-filter="killed">Killed</button>
        <button class="filter-tab" data-filter="update_available">Update Pending</button>
      </div>

      <div class="sort-wrap">
        <label for="sortSelect">Sort:</label>
        <select class="sort-select" id="sortSelect">
          <option value="recent">Last Seen (Recent)</option>
          <option value="name">Machine Name</option>
          <option value="id">Software ID</option>
        </select>
      </div>
    </div>

    <!-- Cards Grid -->
    <div id="grid" class="grid"></div>
  </div>

  <!-- Kill Modal Dialog -->
  <div class="modal-backdrop" id="killModal">
    <div class="modal">
      <div class="modal-title" style="color: var(--red);">
        <span>☠️</span> Kill Software Process
      </div>
      <div class="modal-body">
        <label for="killReasonInput">Reason / Remarks for termination:</label>
        <input class="modal-input" type="text" id="killReasonInput" placeholder="e.g. License expired, unauthorized machine..." />
      </div>
      <div class="modal-btns">
        <button class="modal-btn modal-btn-cancel" onclick="closeModal('killModal')">Cancel</button>
        <button class="modal-btn" style="background: var(--red); color: white;" id="confirmKillBtn">Confirm Kill</button>
      </div>
    </div>
  </div>

  <!-- Update Modal Dialog -->
  <div class="modal-backdrop" id="updateModal">
    <div class="modal">
      <div class="modal-title" style="color: var(--orange);">
        <span>🚀</span> Push Update Package
      </div>
      <div class="modal-body">
        <label for="updateUrlInput">Update script URL (.zip / .py / .exe):</label>
        <input class="modal-input" type="url" id="updateUrlInput" placeholder="https://example.com/update.py" />
      </div>
      <div class="modal-btns">
        <button class="modal-btn modal-btn-cancel" onclick="closeModal('updateModal')">Cancel</button>
        <button class="modal-btn" style="background: var(--orange); color: var(--bg);" id="confirmUpdateBtn">Push Update</button>
      </div>
    </div>
  </div>

  <!-- Settings Modal Dialog -->
  <div class="modal-backdrop" id="settingsModal">
    <div class="modal modal-settings">
      <div class="settings-header-row">
        <div class="modal-title" style="color: var(--accent); margin-bottom: 0;">
          <span>⚙️</span> Remote Settings Control
          <span class="pending-badge" id="settingsPendingBadge" style="display:none;">⏳ Pending</span>
        </div>
      </div>
      <div class="settings-subtitle" id="settingsSubtitle">Loading...</div>

      <div class="settings-form" id="settingsForm">
        <!-- Dynamically populated by JS -->
      </div>

      <div class="modal-btns">
        <button class="modal-btn modal-btn-cancel" onclick="closeModal('settingsModal')">Close</button>
        <button class="modal-btn" style="background: var(--accent); color: var(--bg); font-weight: 800;" id="pushSettingsBtn">⬆ Push Settings</button>
      </div>
    </div>
  </div>

  <!-- Toast Notification Container -->
  <div class="toast-container" id="toastContainer"></div>

  <script>
    // State
    // eslint-disable-next-line
    const initialSoftwares = {{ softwares | tojson | safe }};
    let softwares = initialSoftwares || {};
    const notes = {};

    // Modal target mapping
    let activeActionSoftwareId = null;

    // Filter / Sort States
    let currentFilter = 'all';
    let currentSearchQuery = '';
    let currentSort = 'recent';

    // Populate local notes map
    for(const s of Object.values(softwares)){
      notes[s.software_id] = s.notes || '';
    }

    // Toast Alert Helper
    function showToast(message, type = 'info') {
      const container = document.getElementById('toastContainer');
      const toast = document.createElement('div');
      toast.className = `toast toast-${type}`;
      
      let icon = 'ℹ️';
      if (type === 'success') icon = '✅';
      if (type === 'error') icon = '❌';
      
      toast.innerHTML = `<span>${escapeHtml(icon)}</span><span>${escapeHtml(message)}</span>`;
      container.appendChild(toast);
      
      setTimeout(() => toast.classList.add('show'), 10);
      
      // Auto-remove toast
      setTimeout(() => {
        toast.classList.remove('show');
        setTimeout(() => toast.remove(), 400);
      }, 3500);
    }

    function safeStr(v){ return (v === undefined || v === null || v === '') ? '—' : String(v); }

    function escapeHtml(v){
      if(v === undefined || v === null) return '';
      return String(v).replace(/[&<>"']/g, ch => ({
        '&': '&amp;',
        '<': '&lt;',
        '>': '&gt;',
        '"': '&quot;',
        "'": '&#039;'
      }[ch]));
    }

    function escapeAttr(v){ return escapeHtml(v); }

    function jsArg(v){
      return String(v || '')
        .replace(/\\/g, '\\\\')
        .replace(/'/g, "\\'")
        .replace(/\r/g, '\\r')
        .replace(/\n/g, '\\n')
        .replace(/</g, '\\x3C')
        .replace(/>/g, '\\x3E')
        .replace(/&/g, '\\x26')
        .replace(/"/g, '&quot;');
    }

    function domId(v){
      return String(v || 'unknown').replace(/[^A-Za-z0-9_-]/g, '_');
    }

    function safeStr(v){ return (v === undefined || v === null || v === '') ? '--' : escapeHtml(v); }

    function statusBadge(status){
      if(status === 'active') return '<span class="badge badge-active">ACTIVE</span>';
      if(status === 'killed') return '<span class="badge badge-killed">KILLED</span>';
      if(status === 'update_available') return '<span class="badge badge-update">UPDATE PENDING</span>';
      return '<span class="badge badge-update">' + safeStr(status).toUpperCase() + '</span>';
    }

    function minutesAgo(ts){
      if(!ts) return '—';
      const ms = (Date.now() - (ts*1000));
      const mins = Math.floor(ms / 60000);
      if(mins < 1) return 'Just now';
      return mins + ' min ago';
    }

    function timeNowStr(){
      const d = new Date();
      const pad = (n)=>String(n).padStart(2,'0');
      return d.getFullYear() + '-' + pad(d.getMonth()+1) + '-' + pad(d.getDate()) + ' ' + pad(d.getHours()) + ':' + pad(d.getMinutes()) + ':' + pad(d.getSeconds());
    }

    // Modal Control functions
    function openModal(modalId, softwareId) {
      activeActionSoftwareId = softwareId;
      const backdrop = document.getElementById(modalId);
      backdrop.classList.add('open');
      
      // Clear inputs
      if (modalId === 'killModal') {
        document.getElementById('killReasonInput').value = '';
        setTimeout(() => document.getElementById('killReasonInput').focus(), 100);
      } else if (modalId === 'updateModal') {
        document.getElementById('updateUrlInput').value = '';
        setTimeout(() => document.getElementById('updateUrlInput').focus(), 100);
      }
    }

    function closeModal(modalId) {
      document.getElementById(modalId).classList.remove('open');
      activeActionSoftwareId = null;
    }

    // Modal Submission Handlers
    document.getElementById('confirmKillBtn').addEventListener('click', async () => {
      const softwareId = activeActionSoftwareId;
      const reason = document.getElementById('killReasonInput').value.trim() || 'Killed from dashboard';
      closeModal('killModal');
      
      try {
        await postJSON('/api/admin/kill', { software_id: softwareId, reason });
        showToast(`Process ${softwareId} marked as killed`, 'success');
        await refresh();
      } catch (err) {
        showToast(err.message || 'Failed to kill process', 'error');
      }
    });

    document.getElementById('confirmUpdateBtn').addEventListener('click', async () => {
      const softwareId = activeActionSoftwareId;
      const updateUrl = document.getElementById('updateUrlInput').value.trim();
      if(!updateUrl){ showToast('Update URL is required', 'error'); return; }
      closeModal('updateModal');
      
      try {
        await postJSON('/api/admin/update', { software_id: softwareId, update_url: updateUrl });
        showToast('Update package URL pushed successfully', 'success');
        await refresh();
      } catch (err) {
        showToast(err.message || 'Failed to push update', 'error');
      }
    });

    // ═══════════════════════════════════════════════════════
    //  SETTINGS MODAL — Remote Settings Control + Lock
    // ═══════════════════════════════════════════════════════

    // Settings field definitions
    const SETTINGS_FIELDS = [
      { key: 'active_bom',   label: 'Active BOM',         type: 'text',     placeholder: 'e.g. MainBOM_Rev1.xlsx' },
      { key: 'printer',      label: 'Printer Name',       type: 'text',     placeholder: 'e.g. ZDesigner ZT230' },
      { key: 'bartender_exe',label: 'BarTender EXE Path',  type: 'text',     placeholder: 'C:\\Program Files\\Seagull\\...' },
      { key: 'templates.polaris', label: 'Template — Polaris', type: 'text', placeholder: 'C:\\labels\\polaris.btw' },
      { key: 'templates.minda',   label: 'Template — Minda',   type: 'text', placeholder: 'C:\\labels\\minda.btw' },
      { key: 'templates.solder',  label: 'Template — Solder',  type: 'text', placeholder: 'C:\\labels\\solder.btw' },
      { key: 'last_mode',    label: 'Last Mode',           type: 'text',     placeholder: 'manual / auto' },
      { key: 'column_mapping',       label: 'Column Mapping (JSON)',       type: 'json', placeholder: '[{"column":"A","header":"BTPRINT","source":"label_data"}]' },
      { key: 'minda_column_mapping', label: 'Minda Column Mapping (JSON)', type: 'json', placeholder: '[{"column":"A","header":"BTPRINT","source":"label_data"}]' },
    ];

    // Current settings modal state
    let settingsModalState = {
      softwareId: null,
      currentSettings: {},
      pendingSettings: {},
      lockedSettings: [],
    };

    function getNestedValue(obj, dotKey) {
      const parts = dotKey.split('.');
      let val = obj;
      for (const p of parts) {
        if (val == null) return '';
        val = val[p];
      }
      if (val === null || val === undefined) return '';
      if (typeof val === 'object') return JSON.stringify(val, null, 2);
      return String(val);
    }

    function resolveSettingKey(dotKey) {
      // For lock checking: 'templates.polaris' → check both 'templates.polaris' and 'templates'
      return dotKey;
    }

    async function openSettingsModal(softwareId) {
      settingsModalState.softwareId = softwareId;
      document.getElementById('settingsSubtitle').textContent = 'Loading settings for ' + softwareId + '...';
      document.getElementById('settingsForm').innerHTML = '';
      document.getElementById('settingsPendingBadge').style.display = 'none';
      
      // Open modal
      document.getElementById('settingsModal').classList.add('open');

      try {
        const res = await fetch('/api/admin/settings/' + encodeURIComponent(softwareId));
        if (!res.ok) throw new Error('Failed to fetch settings');
        const data = await res.json();

        settingsModalState.currentSettings = data.current_settings || {};
        settingsModalState.pendingSettings = data.pending_settings || {};
        settingsModalState.lockedSettings = data.locked_settings || [];

        // Show pending badge if there are pending settings
        const hasPending = data.pending_settings && Object.keys(data.pending_settings).length > 0;
        document.getElementById('settingsPendingBadge').style.display = hasPending ? 'inline-flex' : 'none';

        document.getElementById('settingsSubtitle').textContent = softwareId + ' — Edit values and push to software';
        buildSettingsForm();
      } catch (err) {
        document.getElementById('settingsSubtitle').textContent = 'Error: ' + err.message;
        showToast('Failed to load settings: ' + err.message, 'error');
      }
    }

    function buildSettingsForm() {
      const form = document.getElementById('settingsForm');
      form.innerHTML = '';
      const { currentSettings, pendingSettings, lockedSettings } = settingsModalState;

      for (const field of SETTINGS_FIELDS) {
        const isLocked = lockedSettings.includes(field.key);
        const rawCurrentVal = getNestedValue(currentSettings, field.key);
        const currentVal = escapeHtml(rawCurrentVal);
        const pendingVal = getNestedValue(pendingSettings, field.key);

        const row = document.createElement('div');
        row.className = 'setting-row' + (isLocked ? ' is-locked' : '');
        row.setAttribute('data-key', field.key);

        const inputId = 'setting-' + field.key.replace(/\./g, '-');
        const inputValue = pendingVal || rawCurrentVal;

        let inputHtml;
        if (field.type === 'json') {
          inputHtml = `<textarea class="setting-textarea" id="${escapeAttr(inputId)}" placeholder="${escapeAttr(field.placeholder)}">${escapeHtml(inputValue)}</textarea>`;
        } else {
          inputHtml = `<input class="setting-input" type="text" id="${escapeAttr(inputId)}" value="${escapeAttr(inputValue)}" placeholder="${escapeAttr(field.placeholder)}" />`;
        }

        row.innerHTML = `
          <div class="setting-info">
            <div class="setting-label">${escapeHtml(field.label)}</div>
            <div class="setting-current">Current: ${currentVal || '—'}</div>
            ${inputHtml}
          </div>
          <button class="lock-btn ${isLocked ? 'locked' : ''}" type="button" title="${isLocked ? 'Unlock this setting' : 'Lock this setting'}" onclick="toggleLock('${jsArg(field.key)}', this)">
            ${isLocked ? '🔒' : '🔓'}
          </button>
        `;

        form.appendChild(row);
      }
    }

    function toggleLock(settingKey, btn) {
      const idx = settingsModalState.lockedSettings.indexOf(settingKey);
      if (idx >= 0) {
        // Unlock
        settingsModalState.lockedSettings.splice(idx, 1);
        btn.classList.remove('locked');
        btn.innerHTML = '🔓';
        btn.title = 'Lock this setting';
        btn.closest('.setting-row').classList.remove('is-locked');
      } else {
        // Lock
        settingsModalState.lockedSettings.push(settingKey);
        btn.classList.add('locked');
        btn.innerHTML = '🔒';
        btn.title = 'Unlock this setting';
        btn.closest('.setting-row').classList.add('is-locked');
      }
    }

    async function pushSettings() {
      const softwareId = settingsModalState.softwareId;
      if (!softwareId) return;

      // Collect values from form
      const settings = {};
      const templates = {};
      let hasTemplateChanges = false;

      for (const field of SETTINGS_FIELDS) {
        const inputId = 'setting-' + field.key.replace(/\./g, '-');
        const el = document.getElementById(inputId);
        if (!el) continue;

        let value = el.value.trim();
        if (!value) continue; // Skip empty fields — don't push blanks

        // Parse JSON fields
        if (field.type === 'json') {
          try {
            value = JSON.parse(value);
          } catch (e) {
            showToast(`Invalid JSON in "${field.label}". Fix and retry.`, 'error');
            el.focus();
            return;
          }
        }

        const existingRaw = getNestedValue(settingsModalState.pendingSettings, field.key) || getNestedValue(settingsModalState.currentSettings, field.key);
        if (field.type === 'json') {
          let existingParsed = null;
          try {
            existingParsed = existingRaw ? JSON.parse(existingRaw) : null;
          } catch (e) {
            existingParsed = existingRaw;
          }
          if (JSON.stringify(value) === JSON.stringify(existingParsed)) continue;
        } else if (String(value) === String(existingRaw || '').trim()) {
          continue;
        }

        // Handle nested template keys
        if (field.key.startsWith('templates.')) {
          const subKey = field.key.split('.')[1];
          templates[subKey] = value;
          hasTemplateChanges = true;
        } else {
          settings[field.key] = value;
        }
      }

      if (hasTemplateChanges) {
        settings['templates'] = templates;
      }

      if (Object.keys(settings).length === 0 && settingsModalState.lockedSettings.length === 0) {
        showToast('No settings to push', 'info');
        return;
      }

      try {
        await postJSON('/api/admin/settings', {
          software_id: softwareId,
          settings: Object.keys(settings).length > 0 ? settings : undefined,
          locked_settings: settingsModalState.lockedSettings,
        });
        showToast('Settings pushed! Will apply on next heartbeat.', 'success');
        document.getElementById('settingsPendingBadge').style.display = 'inline-flex';
      } catch (err) {
        showToast('Failed to push settings: ' + (err.message || 'Unknown error'), 'error');
      }
    }

    document.getElementById('pushSettingsBtn').addEventListener('click', pushSettings);

    // ═══════════════════════════════════════════════════════

    async function apiList(){
      const res = await fetch('/api/admin/list', { method: 'GET' });
      if(!res.ok){
        const err = await res.json().catch(()=>({}));
        throw new Error(err.error || 'Failed to fetch list');
      }
      return await res.json();
    }

    async function postJSON(url, body){
      const res = await fetch(url, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(body)
      });
      const data = await res.json().catch(()=>({}));
      if(!res.ok){
        throw new Error(data.error || 'Request failed');
      }
      return data;
    }

    function computeStats(softwaresDict){
      const values = Object.values(softwaresDict || {});
      let total = values.length;
      let active = values.filter(s => s.status === 'active').length;
      let killed = values.filter(s => s.status === 'killed').length;
      let lastTs = null;
      for(const s of values){
        if(typeof s.last_seen === 'number'){
          if(lastTs === null || s.last_seen > lastTs) lastTs = s.last_seen;
        }
      }
      return {
        total,
        active,
        killed,
        lastActivity: lastTs ? minutesAgo(lastTs) : '--'
      };
    }

    function render(){
      // stats
      const stats = computeStats(softwares);
      document.getElementById('statTotal').textContent = stats.total;
      document.getElementById('statActive').textContent = stats.active;
      document.getElementById('statKilled').textContent = stats.killed;
      document.getElementById('statLastActivity').textContent = stats.lastActivity;

      // Filter and Sort softwares list
      let list = Object.values(softwares || {});

      // Filter by Status Tab
      if (currentFilter !== 'all') {
        list = list.filter(s => s.status === currentFilter);
      }

      // Filter by Search Query
      if (currentSearchQuery) {
        const q = currentSearchQuery.toLowerCase();
        list = list.filter(s => 
          (s.machine_name || '').toLowerCase().includes(q) ||
          (s.software_id || '').toLowerCase().includes(q) ||
          (s.ip_address || '').toLowerCase().includes(q) ||
          (s.os_name || '').toLowerCase().includes(q)
        );
      }

      // Sort
      list.sort((a, b) => {
        if (currentSort === 'name') {
          return (a.machine_name || '').localeCompare(b.machine_name || '');
        } else if (currentSort === 'id') {
          return (a.software_id || '').localeCompare(b.software_id || '');
        } else {
          return (b.last_seen || 0) - (a.last_seen || 0);
        }
      });

      const grid = document.getElementById('grid');
      grid.innerHTML = '';

      if (list.length === 0) {
        grid.innerHTML = '<div class="no-results">No softwares match the criteria.</div>';
        document.getElementById('lastUpdatedText').textContent = timeNowStr();
        return;
      }

      for(const software of list){
        const softwareKey = String(software.software_id || '');
        const softwareId = safeStr(softwareKey);
        const softwareDomId = domId(softwareKey);
        const softwareJs = jsArg(softwareKey);
        const machineName = safeStr(software.machine_name);
        const version = safeStr(software.version);
        const osName = safeStr(software.os_name);
        const ipAddress = safeStr(software.ip_address);
        const lastSeenFull = software.last_seen ? new Date(software.last_seen*1000).toLocaleString() : '—';
        const notesValue = escapeHtml(notes[softwareKey] || '');

        const card = document.createElement('div');
        card.className = `soft-card card-${software.status}`;
        card.innerHTML = `
          <div class="soft-top">
            <div>
              <div class="soft-name">${machineName}</div>
              <div class="sub" style="margin-top:6px;">ID: ${softwareId}</div>
            </div>
            ${statusBadge(software.status)}
          </div>

          <div class="info-grid">
            <div class="info"><div class="k">Machine name</div><div class="v">${machineName}</div></div>
            <div class="info"><div class="k">Version</div><div class="v">${version}</div></div>
            <div class="info"><div class="k">OS name</div><div class="v">${osName}</div></div>
            <div class="info"><div class="k">IP Address</div><div class="v">${ipAddress}</div></div>
            <div class="info info-last"><div class="k">Last Seen</div><div class="v">${lastSeenFull}</div></div>
          </div>

          <div class="note">
            <div class="k-row">
              <div class="k">Notes / Remarks</div>
              <div class="save-indicator" id="save-${softwareDomId}">Saved</div>
            </div>
            <textarea placeholder="Write administrative remark..." data-software-id="${escapeAttr(softwareKey)}" data-software-dom-id="${softwareDomId}">${notesValue}</textarea>
          </div>

          <div class="btn-row">
            <button class="btn btn-kill" type="button" onclick="openModal('killModal', '${softwareJs}')">Kill</button>
            <button class="btn btn-activate" type="button" id="act-${softwareDomId}">Activate</button>
            <button class="btn btn-update" type="button" onclick="openModal('updateModal', '${softwareJs}')">Push Update</button>
            <button class="btn btn-settings" type="button" onclick="openSettingsModal('${softwareId}')">⚙️ Settings</button>
          </div>
        `;

        // Wire notes textarea autosave
        const ta = card.querySelector('textarea[data-software-dom-id="'+softwareDomId+'"]');
        const indicator = card.querySelector(`#save-${softwareDomId}`);
        let debounceTimer = null;
        
        ta.addEventListener('input', (e) => {
          indicator.textContent = 'Saving...';
          indicator.className = 'save-indicator saving';
          
          clearTimeout(debounceTimer);
          debounceTimer = setTimeout(async () => {
            const newNote = e.target.value;
            notes[softwareKey] = newNote;
            try {
              await postJSON('/api/admin/save_notes', { software_id: softwareKey, notes: newNote });
              indicator.textContent = 'Saved';
              indicator.className = 'save-indicator saved';
            } catch(err) {
              indicator.textContent = 'Error';
              indicator.className = 'save-indicator';
              console.error(err);
            }
          }, 800);
        });

        // Wire activate button
        card.querySelector(`#act-${softwareDomId}`).addEventListener('click', async () => {
          try {
            await postJSON('/api/admin/activate', { software_id: softwareKey });
            showToast(`Process ${softwareKey} status updated to Active`, 'success');
            await refresh();
          } catch(err) {
            showToast(err.message || 'Activation failed', 'error');
          }
        });

        const settingsBtn = card.querySelector('.btn-settings');
        settingsBtn.removeAttribute('onclick');
        settingsBtn.addEventListener('click', () => openSettingsModal(softwareKey));

        grid.appendChild(card);
      }

      // update time in header
      document.getElementById('lastUpdatedText').textContent = timeNowStr();
    }

    async function refresh(){
      try {
        const payload = await apiList();
        softwares = payload.softwares || {};
        // Sync local notes
        for(const s of Object.values(softwares)){
          notes[s.software_id] = s.notes || '';
        }
        render();
      } catch (e) {
        console.error(e);
        document.getElementById('lastUpdatedText').textContent = 'Fetch failed';
      }
    }

    // Wire Control Panel Listeners
    document.getElementById('searchInput').addEventListener('input', (e) => {
      currentSearchQuery = e.target.value;
      render();
    });

    document.querySelectorAll('.filter-tab').forEach(tab => {
      tab.addEventListener('click', (e) => {
        document.querySelectorAll('.filter-tab').forEach(t => t.classList.remove('active'));
        e.target.classList.add('active');
        currentFilter = e.target.getAttribute('data-filter');
        render();
      });
    });

    document.getElementById('sortSelect').addEventListener('change', (e) => {
      currentSort = e.target.value;
      render();
    });

    // Close modals on clicking backdrop
    window.addEventListener('click', (e) => {
      if (e.target.classList.contains('modal-backdrop')) {
        e.target.classList.remove('open');
      }
    });

    // Initial paint and poll
    render();
    refresh();
    
    // Auto-refresh loop (every 10 seconds)
    setInterval(refresh, 10000);
  </script>
</body>
</html>
