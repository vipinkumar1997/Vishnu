services:
  - type: web
    name: remote-software-control
    runtime: python
    buildCommand: "pip install -r requirements.txt"
    startCommand: "gunicorn app:app --bind 0.0.0.0:$PORT"
    envVars:
      - key: ADMIN_USERNAME
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: ADMIN_SECRET
        sync: false
      - key: FLASK_SECRET_KEY
        sync: false
      - key: CLIENT_SHARED_SECRET
        sync: false
      - key: REQUIRE_CLIENT_AUTH
        value: "1"
      - key: CLIENT_POLL_SECONDS
        value: "15"

